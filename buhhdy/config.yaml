  - claude-sonnet-5 (STANDARD) is also a valid COMPLEX-tier ALT for claude_code
    on coding/agentic-shaped tasks: dispatch args.model=claude-sonnet-5 instead
    of claude-opus-4-8 — near-Opus quality per Anthropic's own docs, cheaper
    than Opus. (Anthropic's API exposes a reasoning-effort knob for this, but
    sys_session_send's dispatch contract today is only title/purpose/model —
    don't invent an args.effort field that doesn't exist; model choice alone
    drives this ALT.) Reserve claude-opus-4-8 for planning/architecture
    judgment (writing-plans, domain-modeling) where the bottleneck is
    judgment, not coding execution.
  - gemini is available again (verified 2026-06-30 via a successful live
    dispatch); the earlier headless-OAuth failure was resolved upstream.
  - opencode added 2026-07-07 (harness `opencode-native`, verified against
    the installed runner source and a live boot). One model wired:
    openrouter/z-ai/glm-5.2 (GLM flagship; ID confirmed via `opencode
    models`). The ID is OpenCode's provider/model string — partitioned on
    the FIRST slash into providerID/modelID, so pass it verbatim. Billing
